name: Production Proxy Crash Checkt

on:
  push:
    branches: [ main ]

jobs:
  verify-proxy-deployment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Proxy Dependencies (Fast Mode)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Proxy Boot Test (PM2 Verification)
        run: |
          npm install -g pm2
          
          # Boot your proxy server cleanly to verify there are no hidden crashes
          PORT=8080 pm2 start proxy.js --name proxy-app
          
          # Short 3-second sleep window to check for immediate crashes
          sleep 3
          pm2 list
          
          if ! pm2 show proxy-app | grep -q "status.*online"; then 
            pm2 logs proxy-app --lines 30
            echo "❌ Critical Fault: Proxy application crashed on boot test execution!"
            exit 1
          fi
          
          pm2 delete proxy-app
          pm2 kill

      # Triggers Render automatically only if your global repo secrets contain the hook
      - name: Trigger Render Deploy Hook
        if: success() && secrets.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          echo "🚀 Validation passed safely! Triggering Render proxy deployment..."
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" > /dev/null
